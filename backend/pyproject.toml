[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
pythonVersion = "3.10"
include = ["app", "scripts", "tests"]
exclude = ["alembic/versions", "__pycache__", ".venv"]
reportMissingImports = "error"
